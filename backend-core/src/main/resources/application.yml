server:
  port: 8080

spring:
  application:
    name: bpm-inteligente-core
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/bpm_inteligente}
      auto-index-creation: true

logging:
  level:
    com.bpm.inteligente: DEBUG
    org.springframework.data.mongodb: INFO

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ═══ AI Microservice (Python/FastAPI) ═══
# La lógica de IA se delega al microservicio Python.
# Spring Boot actúa como API Gateway.
ai:
  microservice:
    url: ${AI_MICROSERVICE_URL:http://localhost:8000}
    timeout: 30000

# ═══ JWT Configuration ═══
jwt:
  secret: ${JWT_SECRET:bpm_inteligente_super_secret_key_1234567890_abcdef_9876543210}
  expiration: 604800000

# ═══ Actuator ═══
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
