server:
  port: ${PORT:8080}

spring:
  application:
    name: bpm-inteligente-core
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/bpm_inteligente}
      auto-index-creation: true
      uuid-representation: standard
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    com.bpm.inteligente: DEBUG
    org.springframework.data.mongodb: INFO

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# ═══ AI Microservice (Python/FastAPI) ═══
# La lógica de IA se delega al microservicio Python.
# Spring Boot actúa como API Gateway.
ai:
  microservice:
    url: ${AI_MICROSERVICE_URL:http://localhost:8000}
    timeout: 30000
    secret: ${AI_API_SECRET:dev_secret_local_only}

# ═══ JWT Configuration ═══
jwt:
  secret: ${JWT_SECRET:bpm_inteligente_super_secret_key_1234567890_abcdef_9876543210}
  expiration: 604800000

# ═══ Actuator ═══
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}

# ═══ AWS S3 Configuration ═══
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:bucket-bpm}
    region: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}


