<!-- Floating Toggle Button -->
<button *ngIf="!isOpen" (click)="toggleChat()" 
        class="fixed bottom-6 right-6 z-[60] w-14 h-14 bg-gradient-to-tr from-emerald-500 to-teal-500 rounded-full shadow-lg shadow-emerald-500/30 flex items-center justify-center hover:scale-105 transition-transform animate-bounce">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  
  <!-- Notification Dot -->
  <span class="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 border-2 border-slate-900 rounded-full"></span>
</button>

<!-- Chat Panel -->
<div *ngIf="isOpen" class="fixed bottom-6 right-6 z-[60] w-[350px] h-[500px] bg-slate-900/95 backdrop-blur-xl border border-emerald-500/30 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
  
  <!-- Header -->
  <div class="bg-gradient-to-r from-emerald-500/20 to-teal-500/10 p-4 border-b border-emerald-500/20 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      </div>
      <div>
        <h3 class="text-sm font-bold text-emerald-400">BPM-Guía</h3>
        <p class="text-[10px] text-slate-400">Asistente Interactivo de Entrenamiento</p>
      </div>
    </div>
    <button (click)="toggleChat()" class="text-slate-400 hover:text-white transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  
  <!-- Messages -->
  <div #scrollContainer class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngFor="let msg of messages" class="flex flex-col max-w-[85%]" [ngClass]="msg.isBot ? 'self-start' : 'self-end items-end'">
      <div class="px-4 py-2.5 rounded-2xl shadow-sm text-sm"
           [ngClass]="msg.isBot ? 'bg-slate-800 text-slate-200 rounded-tl-sm border border-slate-700/50' : 'bg-emerald-600 text-white rounded-tr-sm'">
        <!-- Renderizado de Markdown para el Bot -->
        <div *ngIf="msg.isBot" [innerHTML]="msg.text" class="leading-relaxed"></div>
        <!-- Texto plano para el Usuario -->
        <span *ngIf="!msg.isBot" class="whitespace-pre-wrap leading-relaxed">{{ msg.text }}</span>
      </div>
      <span class="text-[9px] text-slate-500 mt-1 px-1">{{ msg.timestamp | date:'shortTime' }}</span>
    </div>
    
    <!-- Typing indicator -->
    <div *ngIf="isTyping" class="self-start px-4 py-3 bg-slate-800 border border-slate-700/50 rounded-2xl rounded-tl-sm flex gap-1 items-center">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce" style="animation-delay: 0s;"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce" style="animation-delay: 0.2s;"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-bounce" style="animation-delay: 0.4s;"></span>
    </div>
  </div>
  
  <!-- Input Area -->
  <div class="p-3 border-t border-slate-800 bg-slate-900/80">
    <div class="relative flex items-center">
      <input type="text" [(ngModel)]="inputText" (keyup.enter)="sendMessage()" [disabled]="isTyping"
             placeholder="Pregunta cómo usar el sistema..."
             class="w-full pl-4 pr-12 py-3 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
      <button (click)="sendMessage()" [disabled]="!inputText.trim() || isTyping"
              class="absolute right-1 w-9 h-9 flex items-center justify-center rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:hover:bg-emerald-600 text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>
  </div>
</div>
