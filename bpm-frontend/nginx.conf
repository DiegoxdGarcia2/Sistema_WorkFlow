server {
    listen PORT;
    server_name localhost;
    client_max_body_size 25M;

    # Frontend Assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache control
    location ~* \.(?:js|css|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ═══ Reverse proxy for AI microservice (SSE streaming) ═══
    # CRITICAL: SSE (Server-Sent Events) requires buffering OFF
    # so that chunks are forwarded immediately to the browser.
    location /api/ai/ {
        proxy_pass AI_SERVICE_URL/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        # ── SSE / Streaming support ──
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # ── Timeouts for long-running AI requests ──
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # ═══ Health check proxy for AI microservice ═══
    location /ai-health/ {
        proxy_pass AI_SERVICE_URL/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_read_timeout 10s;
    }

    # ═══ Reverse proxy for Backend Core API ═══
    location /api/ {
        proxy_pass BACKEND_URL/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        # ── SSE support for chatbot streaming via backend ──
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # ═══ Reverse proxy for Spring Boot WebSocket (STOMP) ═══
    location /ws-bpm/ {
        proxy_pass BACKEND_URL/ws-bpm/;
        proxy_http_version 1.1;

        # ── WebSocket Upgrade headers ──
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Long timeouts for persistent WebSocket connections ──
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
